<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--ARTIFACT-START-->
<title>Git no Codespaces</title>
<meta name="description" content="Slides do curso de Git no GitHub Codespaces: 16 desafios, conceitos, diagramas e links de documentação.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#0A0F1F; --panel:#0F162C; --panel-2:#141D38; --ink:#E9EDF8; --ink-2:#C3CBE3; --muted:#8792B3;
  --blue:#1428A0; --aqua:#3ED6E4; --aqua-ink:#062B33; --aqua-soft:rgba(62,214,228,.10);
  --line:#1F2946; --line-2:#2B3760; --amber:#F2B95C; --red:#F08A8A; --green:#7ADFB0;
  --display:"Manrope","IBM Plex Sans","Segoe UI",Helvetica,Arial,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --r:10px; --r-s:6px;
  --gutter:clamp(20px,4vw,56px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:clamp(15px,1.12vw,18.5px);line-height:1.6;min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:var(--aqua)}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--aqua);outline-offset:3px;border-radius:var(--r-s)}
code,pre,kbd{font-family:var(--mono)}
code{background:var(--panel-2);border-radius:4px;padding:.08em .4em;font-size:.9em;color:var(--aqua);white-space:nowrap}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:-.015em;line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
strong{font-weight:600;color:var(--ink)}
::selection{background:var(--aqua);color:var(--aqua-ink)}
.mono{font-family:var(--mono)}
.up{font-family:var(--mono);text-transform:uppercase;letter-spacing:.1em;font-size:.7em;color:var(--muted)}
.hidden{display:none!important}

/* ---------- Home ---------- */
#home{padding:var(--gutter);padding-block:clamp(32px,6vh,80px);max-width:1280px;margin:0 auto}
.hero{display:grid;grid-template-columns:1fr auto;gap:32px;align-items:end;padding-bottom:clamp(24px,4vh,40px);border-bottom:1px solid var(--line)}
.hero h1{font-size:clamp(38px,5.5vw,72px);font-weight:700;line-height:1.02}
.hero h1 span{display:block;color:var(--aqua);font-weight:500}
.hero .sub{color:var(--ink-2);max-width:58ch;margin-top:18px;font-size:1.05em}
.hero .meta{display:flex;gap:28px;font-family:var(--mono);font-size:.78em;color:var(--muted);text-align:left}
.hero .meta b{display:block;color:var(--ink);font-size:1.9em;font-family:var(--display);font-weight:600;line-height:1.1;margin-bottom:2px}
.legend{display:flex;flex-wrap:wrap;gap:10px 28px;margin:24px 0 20px;font-family:var(--mono);font-size:.78em;color:var(--muted);align-items:center}
.legend .sw{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--line-2);vertical-align:0;margin-right:8px}
.legend .sw.el{background:var(--amber)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.tile{position:relative;display:grid;grid-template-rows:auto 1fr auto;gap:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:20px;color:var(--ink);text-decoration:none;min-height:180px;transition:border-color .15s ease,background .15s ease}
.tile:hover,.tile:focus-visible{border-color:var(--aqua);background:var(--panel-2);outline:none}
.tile .num{font-family:var(--mono);font-size:.82em;color:var(--aqua);letter-spacing:.06em}
.tile .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.tile .mod{font-family:var(--mono);font-size:.68em;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:right;line-height:1.4}
.tile h3{font-size:clamp(18px,1.4vw,21px);font-weight:600;line-height:1.25}
.tile .cmds{font-family:var(--mono);font-size:.76em;color:var(--muted);line-height:1.6}
.tile .foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:12px;font-family:var(--mono);font-size:.72em;color:var(--muted)}
.tile.el::after{content:"";position:absolute;top:22px;right:20px;width:8px;height:8px;border-radius:50%;background:var(--amber)}
.tile.el .mod{padding-right:16px}
.homefoot{margin-top:40px;display:flex;flex-wrap:wrap;gap:10px 32px;font-family:var(--mono);font-size:.76em;color:var(--muted);border-top:1px solid var(--line);padding-top:18px}
.homefoot a{color:var(--ink-2)}
kbd{display:inline-block;border:1px solid var(--line-2);border-radius:4px;padding:0 6px;font-size:.9em;color:var(--ink-2);line-height:1.6;margin:0 2px;background:var(--panel)}

/* ---------- Deck ---------- */
#deck{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto}
.rail{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px var(--gutter);border-bottom:1px solid var(--line);background:rgba(10,15,31,.92);backdrop-filter:blur(8px);font-family:var(--mono);font-size:.78em;position:sticky;top:0;z-index:5}
.rail.bottom{border-bottom:0;border-top:1px solid var(--line);position:sticky;bottom:0}
.rail .crumb{color:var(--muted);text-align:center;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail .crumb b{color:var(--ink-2);font-weight:500}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);border-radius:var(--r-s);background:transparent;color:var(--ink-2);font-family:var(--mono);font-size:1em;padding:8px 14px;cursor:pointer;text-decoration:none;transition:border-color .15s,color .15s,background .15s;white-space:nowrap}
.btn:hover{border-color:var(--aqua);color:var(--aqua)}
.btn.primary{background:var(--aqua);color:var(--aqua-ink);border-color:var(--aqua)}
.btn.primary:hover{background:#63E0EB;color:var(--aqua-ink)}
.btn[disabled]{opacity:.3;pointer-events:none}
.counter{font-variant-numeric:tabular-nums;color:var(--muted)}
.dots{display:flex;gap:6px}
.dots i{width:18px;height:3px;border-radius:2px;background:var(--line-2);display:block}
.dots i.on{background:var(--aqua)}
.slide{padding:clamp(28px,5vh,56px) var(--gutter);max-width:1200px;margin:0 auto;width:100%;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.slide,.tile,.btn{animation:none;transition:none}}
.slide .eyebrow{font-family:var(--mono);font-size:.74em;text-transform:uppercase;letter-spacing:.12em;color:var(--aqua);margin-bottom:12px}
.slide h2{font-size:clamp(26px,3.4vw,44px);margin-bottom:clamp(20px,3.5vh,36px);font-weight:600}
.slide h3{font-size:clamp(15px,1.15vw,17px);font-weight:600;letter-spacing:0;margin-bottom:10px;color:var(--ink)}
.lead{font-size:clamp(17px,1.45vw,22px);max-width:60ch;line-height:1.5;color:var(--ink-2);font-weight:400}
.lead strong,.lead em{color:var(--ink)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:clamp(16px,2vw,28px);align-items:start}
.cols.w2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.cols.s2{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)}
@media (max-width:820px){.cols.s2{grid-template-columns:1fr}}
.stack{display:grid;gap:clamp(14px,2vh,22px)}
.box{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:clamp(16px,1.6vw,22px)}
.box.lift{border-color:var(--line-2);background:var(--panel-2)}
.box.soft{background:transparent}
.box p{color:var(--ink-2)}
.box p+p{margin-top:.6em}
.callout{border-left:2px solid var(--aqua);padding:4px 0 4px 16px;color:var(--ink-2)}
.callout.warn{border-left-color:var(--amber)}
.callout.warn strong{color:var(--amber)}
.callout strong{color:var(--aqua)}
pre.cmd{margin:0;background:#070B18;border:1px solid var(--line);border-radius:var(--r-s);padding:14px 16px;font-size:clamp(13px,1vw,15.5px);line-height:1.6;overflow-x:auto;color:var(--ink)}
pre.cmd .p{color:var(--aqua);user-select:none}
pre.cmd .c{color:var(--muted)}
pre.cmd .o{color:var(--muted)}
pre.cmd .add{color:var(--green)}
pre.cmd .del{color:var(--red)}
pre.cmd .mk{color:var(--amber)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--mono);font-size:.76em;border:1px solid var(--line-2);border-radius:999px;color:var(--ink-2);padding:4px 12px;background:transparent}
.chip.amber{border-color:var(--amber);color:var(--amber)}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:14px;counter-reset:s}
.steps li{display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:start;counter-increment:s}
.steps li::before{content:counter(s);font-family:var(--mono);font-size:.8em;color:var(--aqua);border:1px solid var(--line-2);border-radius:50%;width:24px;height:24px;display:grid;place-items:center;margin-top:3px}
.steps li .t{margin-bottom:8px;color:var(--ink-2)}
.steps li>div{color:var(--ink-2)}
.steps pre.cmd{padding:10px 14px}
table.kv{width:100%;border-collapse:collapse;font-size:.94em}
table.kv th,table.kv td{text-align:left;padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--ink-2)}
table.kv tr:last-child td{border-bottom:0}
table.kv th{font-family:var(--mono);font-weight:400;text-transform:uppercase;letter-spacing:.1em;font-size:.7em;color:var(--muted)}
table.kv th:empty{padding:0;border:0}
table.kv td:first-child{font-family:var(--mono);color:var(--aqua);white-space:nowrap;font-size:.9em}
.tw{overflow-x:auto}
ul.links{list-style:none;margin:0;padding:0;display:grid;gap:10px}
ul.links li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:baseline}
ul.links li::before{content:"↗";color:var(--muted);font-family:var(--mono);font-size:.9em}
ul.links a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line-2)}
ul.links a:hover{color:var(--aqua);border-bottom-color:var(--aqua)}
ul.links small{display:block;color:var(--muted);font-family:var(--mono);font-size:.76em;margin-top:2px}
ul.plain{margin:0;padding-left:1.1em;display:grid;gap:6px;color:var(--ink-2)}
.big{font-family:var(--mono);font-size:.8em;color:var(--aqua);letter-spacing:.1em}
.big::before{content:"Desafio "}
details{border:1px solid var(--line-2);border-radius:var(--r);padding:12px 16px}
details summary{cursor:pointer;font-family:var(--mono);color:var(--amber);letter-spacing:.04em;font-size:.8em}
details[open] summary{margin-bottom:10px}

/* Flow diagrams (three areas etc.) */
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:10px;justify-content:center}
.flow .node{flex:1 1 150px;min-width:150px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--panel);padding:14px;display:grid;gap:4px;align-content:center;text-align:center}
.flow .node b{font-family:var(--display);font-weight:600;font-size:.98em;color:var(--ink)}
.flow .node small{color:var(--muted);font-family:var(--mono);font-size:.72em;line-height:1.4}
.flow .node.hi{border-color:var(--aqua);background:var(--aqua-soft)}
.flow .node.dim{border-color:var(--line);color:var(--muted)}
.flow .arr{flex:0 0 auto;display:grid;place-items:center;font-family:var(--mono);font-size:.72em;color:var(--muted);text-align:center;padding:0 6px;gap:2px}
.flow .arr strong{color:var(--aqua);font-weight:500}
.flow .arr .a{font-size:1.6em;line-height:1;color:var(--aqua)}
.flow .arr.back .a{color:var(--amber)}
.flow.vert{flex-direction:column}
.flow.vert .node{flex-basis:auto}
@media (max-width:640px){.flow{flex-direction:column}.flow .arr .a{transform:rotate(90deg)}}

/* SVG commit graphs */
svg.graph{width:100%;height:auto;display:block;max-width:100%;font-family:var(--mono)}
svg.graph .e{stroke:var(--line-2);stroke-width:2;fill:none}
svg.graph .e.dim{stroke:var(--line);stroke-dasharray:5 6}
svg.graph .e.hi{stroke:var(--aqua)}
svg.graph .c circle{fill:var(--panel-2);stroke:var(--ink-2);stroke-width:2}
svg.graph .c.hi circle{fill:var(--aqua);stroke:var(--aqua)}
svg.graph .c.hi text{fill:var(--aqua-ink)}
svg.graph .c.ghost circle{stroke:var(--line-2);stroke-dasharray:4 4;fill:transparent}
svg.graph .c.ghost text{fill:var(--muted)}
svg.graph .c.bad circle{stroke:var(--amber)}
svg.graph .c.merge circle{fill:var(--blue);stroke:var(--blue)}
svg.graph .c text{fill:var(--ink);font-size:12.5px;text-anchor:middle;font-weight:500}
svg.graph .cap{fill:var(--muted);font-size:12px;text-anchor:middle}
svg.graph .ref rect{fill:var(--panel);stroke:var(--line-2);stroke-width:1;rx:6}
svg.graph .ref text{fill:var(--ink-2);font-size:12.5px;text-anchor:middle;font-weight:500}
svg.graph .ref.head rect{fill:var(--aqua);stroke:var(--aqua)}
svg.graph .ref.head text{fill:var(--aqua-ink)}
svg.graph .ref.remote rect{fill:var(--blue);stroke:var(--blue)}
svg.graph .ref.remote text{fill:var(--ink)}
svg.graph .ref.dead rect{stroke:var(--line);fill:transparent;stroke-dasharray:4 4}
svg.graph .ref.dead text{fill:var(--muted)}
svg.graph .ref line{stroke:var(--line-2);stroke-width:1.5}
svg.graph .ref.head line{stroke:var(--aqua)}
svg.graph .tag{fill:var(--amber);font-size:12px;text-anchor:middle;font-weight:500}
.gwrap{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:12px 14px}
.gwrap .cap{font-family:var(--mono);font-size:.72em;color:var(--muted);letter-spacing:.04em;margin-bottom:6px}
</style>
</head>
<body>
<main id="home"></main>
<main id="deck" class="hidden">
  <div class="rail">
    <a class="btn" href="#/" id="btnHome">← Desafios</a>
    <div class="crumb" id="crumb"></div>
    <div class="counter" id="counter"></div>
  </div>
  <section class="slide" id="slide"></section>
  <div class="rail bottom">
    <button class="btn" id="btnPrev">← Anterior</button>
    <div class="dots" id="dots"></div>
    <button class="btn primary" id="btnNext">Próximo →</button>
  </div>
</main>

<script>
/* ---------- helpers ---------- */
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

// Command block: lines starting with "$ " become prompt lines; "# " comment lines; "+ "/"- " diff lines; "<<<"/"==="/">>>" markers.
function cmd(text){
  const lines = text.replace(/^\n/,'').replace(/\n\s*$/,'').split('\n');
  return '<pre class="cmd">' + lines.map(l=>{
    if (l.startsWith('$ ')) return '<span class="p">$ </span>' + esc(l.slice(2));
    if (/^\s*#/.test(l)) return '<span class="c">' + esc(l) + '</span>';
    if (/^(<<<<<<<|=======|>>>>>>>)/.test(l)) return '<span class="mk">' + esc(l) + '</span>';
    if (l.startsWith('+ ') || l.startsWith('+')) return '<span class="add">' + esc(l) + '</span>';
    if (l.startsWith('- ')) return '<span class="del">' + esc(l) + '</span>';
    if (l.startsWith('> ')) return '<span class="o">' + esc(l.slice(2)) + '</span>';
    return esc(l);
  }).join('\n') + '</pre>';
}

// Commit graph as SVG.
// spec = { commits:[{id,x,y,label?,cls?}], edges:[[child,parent,cls?]], refs:[{name,at,cls?,below?}], caps:[{at,text}], cap? }
function graph(spec){
  const CX=118, CY=88, R=17, PX=70, RH=26, GAP=8, STEP=RH+GAP;
  const cs = spec.commits, refs = spec.refs||[], caps = spec.caps||[], tags = spec.tags||[];
  const cols = Math.max(...cs.map(c=>c.x))+1, rows = Math.max(...cs.map(c=>c.y))+1;
  // how many labels stack above / below each commit, to size the padding and place captions
  const up = {}, down = {};
  for (const r of refs){ const k = r.at; if (r.below) down[k]=(down[k]||0)+1; else up[k]=(up[k]||0)+1; }
  const maxUp = Math.max(0, ...Object.values(up)), maxDown = Math.max(0, ...Object.values(down));
  const hasCap = caps.length || tags.length;
  const PT = 20 + R + (maxUp ? 10 + maxUp*STEP : 0);
  const PB = R + (maxDown ? 10 + maxDown*STEP : 0) + (hasCap ? 30 : 0) + 16;
  const W = PX*2 + (cols-1)*CX, H = PT + (rows-1)*CY + PB;
  const pos = id => { const c = cs.find(c=>c.id===id); return [PX + c.x*CX, PT + c.y*CY]; };
  let edges = '', nodes = '', lines = '', labels = '', text = '';
  for (const e of (spec.edges||[])){
    const [x1,y1]=pos(e[0]), [x2,y2]=pos(e[1]);
    const d = y1===y2 ? `M${x1},${y1} L${x2},${y2}` : `M${x1},${y1} C${(x1+x2)/2},${y1} ${(x1+x2)/2},${y2} ${x2},${y2}`;
    edges += `<path d="${d}" class="e ${e[2]||''}"/>`;
  }
  for (const c of cs){
    const [x,y]=pos(c.id);
    nodes += `<g class="c ${c.cls||''}"><circle cx="${x}" cy="${y}" r="${R}"/><text x="${x}" y="${y+5}">${esc(c.label||c.id)}</text></g>`;
  }
  // labels: connector lines go in their own layer, under every label box
  const seenUp = {}, seenDown = {};
  for (const r of refs){
    const [x,y]=pos(r.at), k = r.at;
    let top;
    if (r.below){ const i = seenDown[k]=(seenDown[k]||0); seenDown[k]++; top = y + R + 10 + i*STEP; }
    else { const i = seenUp[k]=(seenUp[k]||0); seenUp[k]++; top = y - R - 10 - RH - i*STEP; }
    const w = r.name.length*8 + 22;
    const ly1 = r.below ? y+R : y-R, ly2 = r.below ? top : top+RH;
    lines += `<g class="ref ${r.cls||''}"><line x1="${x}" y1="${ly1}" x2="${x}" y2="${ly2}"/></g>`;
    labels += `<g class="ref ${r.cls||''}"><rect x="${x-w/2}" y="${top}" width="${w}" height="${RH}"/><text x="${x}" y="${top+18}">${esc(r.name)}</text></g>`;
  }
  // captions sit under the commit, or under its lower labels when it has any
  const capY = k => { const [,y]=pos(k); return y + R + 20 + (down[k] ? 10 + down[k]*STEP - 8 : 0); };
  for (const c of caps) text += `<text class="cap" x="${pos(c.at)[0]}" y="${capY(c.at)}">${esc(c.text)}</text>`;
  for (const t of tags) text += `<text class="tag" x="${pos(t.at)[0]}" y="${capY(t.at)}">${esc(t.text)}</text>`;
  return `<div class="gwrap">${spec.cap?`<div class="cap">${spec.cap}</div>`:''}<svg class="graph" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(spec.alt||'Grafo de commits')}">${edges}${lines}${nodes}${labels}${text}</svg></div>`;
}

// Simple linear chain helper: ids in order, all on row y.
function chain(ids, y=0, x0=0){ return ids.map((id,i)=>({id, x:x0+i, y})); }
function link(ids){ const e=[]; for(let i=1;i<ids.length;i++) e.push([ids[i],ids[i-1]]); return e; }

function docs(items){
  return '<ul class="links">' + items.map(i=>`<li><div><a href="${i.href}" target="_blank" rel="noopener">${i.t}</a>${i.s?`<small>${i.s}</small>`:''}</div></li>`).join('') + '</ul>';
}
function kv(rows, head=['Comando','Para quê']){
  return `<div class="tw"><table class="kv"><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>` +
    rows.map(r=>`<tr>${r.map((c,i)=>`<td>${i===0?`<code>${esc(c)}</code>`:c}</td>`).join('')}</tr>`).join('') + '</tbody></table></div>';
}
function steps(items){ return '<ol class="steps">' + items.map(i=>`<li><div>${i}</div></li>`).join('') + '</ol>'; }
function chips(list, cls=''){ return `<div class="chips">${list.map(c=>`<span class="chip ${cls}">${esc(c)}</span>`).join('')}</div>`; }

// Standard cover slide for a desafio.
function cover(d, objetivo, onde, extra=''){
  return `<div class="cols s2"><div class="stack">
    <div class="big">${String(d.n).padStart(2,'0')}</div>
    <p class="lead">${objetivo}</p>
    ${chips(d.cmds)}
    ${extra}
  </div><div class="stack">
    <div class="box lift"><h3>Onde</h3>${onde}</div>

D.push({n:6, key:'06', title:'Desfazendo antes do commit', mod:'Módulo 3b · Desfazendo', time:5, el:false, cmds:['git restore','git restore --staged'],
  slides:[
    {h:'Desfazendo antes do commit', body: cover({n:6,time:5,el:false,mod:'Módulo 3b · Desfazendo',cmds:['git restore <arquivo>','git restore --staged <arquivo>']},
      'Recuperar o conteúdo de um arquivo alterado por engano e tirar outro arquivo da staging area, <strong>sem criar um commit</strong>.',
      cmd('$ cd ~/labs/06-desfazendo-antes-do-commit') + '<p style="margin-top:10px;color:var(--muted)">Há duas alterações feitas por engano: <code>bolo-de-cenoura.md</code> foi sobrescrito com três linhas de "ops" no diretório de trabalho, e <code>notas-pessoais.md</code>, com a senha do Wi-Fi, foi adicionado à staging area.</p>')},
    {h:'Descartar uma mudança ou tirá-la da staging', eyebrow:'Conceito · restore', body:`
      <div class="stack">
        ${areas({hi:['wd','st'], back:true})}
        <div class="cols">
          <div class="box lift"><h3>git restore --staged arquivo</h3><p>Tira o arquivo da staging area. O conteúdo no diretório de trabalho <strong>não muda</strong>: ele volta a ser só "modificado" (ou <em>untracked</em>, se era novo). Nada se perde.</p></div>
          <div class="box"><h3>git restore arquivo</h3><p>Descarta a mudança no diretório de trabalho e traz de volta a versão da staging (ou do último commit, se a staging está vazia). <strong>Perde o que você editou.</strong></p></div>
        </div>
        <div class="callout warn"><strong>restore descarta as alterações sem pedir confirmação.</strong> Antes de usar, confira o <code>git diff</code> e confirme que quer descartar essas mudanças. Alterações nunca commitadas não estão registradas no histórico para recuperação.</div>
        <p style="color:var(--muted)">Na internet você vai encontrar as formas antigas: <code>git checkout -- arquivo</code> e <code>git reset HEAD arquivo</code>. Fazem o mesmo; <code>restore</code> existe desde 2019 justamente para separar essas duas ideias.</p>
      </div>`},
    {h:'O desafio', eyebrow:'Tarefa · 5 min', body:`
      <div class="cols s2"><div class="stack">${steps([
        `<div class="t">Confira as duas alterações feitas por engano:</div>${cmd('$ git status\n$ git diff')}`,
        `<div class="t">Descarte a mudança no bolo, trazendo de volta a versão do último commit:</div>${cmd('$ git restore bolo-de-cenoura.md\n$ cat bolo-de-cenoura.md')}`,
        `<div class="t">Tire as notas da staging, sem apagar o arquivo do disco. Ele continua na pasta, agora como <em>untracked</em>:</div>${cmd('$ git restore --staged notas-pessoais.md\n$ git status')}`,
        `<div class="t"><strong>Não faça commit.</strong> O desafio termina com a árvore igual ao último commit, mais o arquivo de notas não rastreado.</div>`,
      ])}</div><div class="stack">
        <div class="box"><h3>Verificação</h3>${cmd('$ check.sh 06')}</div>
        <div class="callout"><strong>Leia as sugestões do <code>git status</code>.</strong> A saída indica os comandos para descartar uma alteração ou retirá-la da staging area ("use git restore…").</div>
        <div class="box soft"><h3>Missão extra</h3><p>Adicione <code>notas-pessoais.md</code> a um <code>.gitignore</code> para que nunca mais apareça como não rastreado.</p></div>
      </div></div>`},
    {h:'Comandos & documentação', eyebrow:'Referência', body:`
      <div class="cols s2">
        ${kv([
          ['git restore <arquivo>','descarta a mudança no diretório de trabalho'],
          ['git restore --staged <arquivo>','tira da staging; mantém a edição no disco'],
          ['git restore --staged --worktree <arquivo>','os dois de uma vez'],
          ['git restore --source=<hash> <arquivo>','traz a versão de um commit específico'],
          ['git restore .','descarta tudo — cuidado'],
        ])}
        <div class="box soft"><h3>Documentação</h3>${docs([L.pg_desfaz, L.r_restore, L.r_status])}</div>
      </div>`},
  ]});

D.push({n:7, key:'07', title:'Desfazendo depois do commit', mod:'Módulo 3b · Desfazendo', time:6, el:false, cmds:['git commit --amend','git revert'],
  slides:[
    {h:'Desfazendo depois do commit', body: cover({n:7,time:6,el:false,mod:'Módulo 3b · Desfazendo',cmds:['git commit --amend -m','git revert <hash>','git show HEAD']},
      'Corrigir o último commit com <strong>--amend</strong> e desfazer um commit antigo com <strong>revert</strong>, que cria um commit novo em vez de apagar o histórico.',
      cmd('$ cd ~/labs/07-desfazendo-depois-do-commit') + '<p style="margin-top:10px;color:var(--muted)">O <strong>último</strong> commit tem "pudin" em vez de "pudim" na mensagem. Um commit <strong>antigo</strong>, "Ajusta ingredientes do brigadeiro", trocou a manteiga por sal, e outros commits vieram depois.</p>')},
    {h:'Corrigir o último commit com --amend', eyebrow:'Conceito · reescrever o último commit', body:`
      <div class="cols w2">
        ${graph({cap:'antes', commits:chain(['C1','C2','C3']), edges:link(['C1','C2','C3']), refs:[{name:'main',at:'C3'},{name:'HEAD',at:'C3',cls:'head'}], caps:[{at:'C3',text:'"…pudin"'}]})}
        ${graph({cap:'depois de git commit --amend', commits:[...chain(['C1','C2']), {id:'C3',x:2,y:1,cls:'ghost',label:'C3'}, {id:"C3'",x:2,y:0,cls:'hi',label:"C3'"}],
          edges:[['C2','C1'],["C3'",'C2'],['C3','C2','dim']], refs:[{name:'main',at:"C3'"},{name:'HEAD',at:"C3'",cls:'head'}], caps:[{at:"C3'",text:'"…pudim"'},{at:'C3',text:'ninguém aponta mais'}]})}
      </div>
      <div class="cols" style="margin-top:20px">
        <div class="box lift"><h3>O que acontece</h3><p><code>--amend</code> pega a staging (vazia ou não) e a nova mensagem e cria <strong>outro commit</strong> no lugar do último. O hash muda. O antigo fica órfão.</p></div>
        <div class="callout warn"><strong>Use --amend só em commits ainda não compartilhados.</strong> Se alguém já baixou o C3, a substituição cria dois históricos diferentes e dificulta a sincronização. Nesta aula, siga a regra: <em>nunca reescreva o que já foi para o remoto</em>.</div>
        <div class="box"><h3>Usos comuns</h3><ul class="plain"><li>corrigir a mensagem: <code>--amend -m "…"</code></li><li>esqueceu um arquivo: <code>git add x</code> + <code>--amend --no-edit</code></li></ul></div>
      </div>`},
    {h:'Desfazer uma mudança com revert', eyebrow:'Conceito · desfazer sem apagar', body:`
      <div class="cols s2"><div class="stack">
        ${graph({cap:'git revert C2  →  cria C5, o inverso de C2', commits:[...chain(['C1','C2','C3','C4']), {id:'C5',x:4,y:0,cls:'hi'}], edges:link(['C1','C2','C3','C4','C5']),
          refs:[{name:'main',at:'C5'},{name:'HEAD',at:'C5',cls:'head'}], caps:[{at:'C2',text:'manteiga → sal'},{at:'C5',text:'sal → manteiga'}], tags:[]})}
        <p class="lead">O commit que você quer desfazer <strong>continua</strong> no histórico. O revert acrescenta outro commit com a alteração inversa, preservando os commits existentes. Por isso, pode ser usado mesmo depois do push.</p>
      </div><div class="stack">
        <div class="box"><h3>amend × revert</h3>${kv([
          ['--amend','reescreve o último commit · hash muda · só antes de compartilhar'],
          ['revert <hash>','cria um commit com a alteração inversa · preserva o histórico compartilhado'],
          ['reset','move ponteiros e pode remover commits do histórico da branch; não será abordado nesta aula'],
        ], ['','' ])}</div>
        <div class="callout"><code>git revert</code> abre o VS Code com a mensagem pronta. <strong>Salve e feche a aba</strong> para concluir o commit; enquanto ela estiver aberta, o terminal aguarda o editor.</div>
      </div></div>`},
    {h:'O desafio', eyebrow:'Tarefa · 6 min', body:`
      <div class="cols s2"><div class="stack">${steps([
        `<div class="t">Corrija a mensagem <strong>antes de fazer o revert</strong>, enquanto esse ainda é o último commit. Observe que o hash muda:</div>${cmd('$ git commit --amend -m "Adiciona receita de pudim"\n$ git log --oneline')}`,
        `<div class="t">Ache o hash do commit do sal e desfaça-o. O editor abre com a mensagem pronta; salve e feche:</div>${cmd('$ git log --oneline\n$ git revert <hash-do-commit-do-sal>')}`,
        `<div class="t">Confira: o brigadeiro voltou a ter manteiga, o commit do sal continua lá, e há um commit novo desfazendo-o.</div>${cmd('$ grep manteiga brigadeiro.md\n$ git log --oneline')}`,
      ])}</div><div class="stack">
        <div class="box"><h3>Verificação</h3>${cmd('$ check.sh 07')}</div>
        <div class="callout warn"><strong>Faça o amend primeiro.</strong> Se fizer o revert antes, o amend alterará a mensagem dele, e o erro "pudin" permanecerá. Nesse caso, use <code>reset.sh 07</code> para recomeçar.</div>
        <div class="box soft"><h3>Missão extra</h3><p>Confira as alterações do revert com <code>git show HEAD</code>. Depois use <code>git revert HEAD</code> para desfazer o próprio revert e repita <code>git revert HEAD</code> para voltar ao resultado anterior.</p></div>
      </div></div>`},
    {h:'Comandos & documentação', eyebrow:'Referência', body:`
      <div class="cols s2">
        ${kv([
          ['git commit --amend -m "msg"','troca a mensagem do último commit (e inclui o que estiver na staging)'],
          ['git commit --amend --no-edit','inclui a staging no último commit sem mexer na mensagem'],
          ['git revert <hash>','commit novo com o inverso do commit indicado'],
          ['git revert --no-edit <hash>','sem abrir o editor'],
          ['git revert --abort','desiste de um revert com conflito'],
          ['git show HEAD','o último commit em detalhe'],
        ])}
        <div class="box soft"><h3>Documentação</h3>${docs([L.pg_desfaz, L.pg_rewrite, L.r_commit, L.r_revert])}</div>
      </div>`},
  ]});

D.push({n:8, key:'08', title:'Branch de funcionalidade', mod:'Módulo 4 · Branches', time:5, el:false, cmds:['git switch -c','git merge (fast-forward)'],
  slides:[
    {h:'Branch de funcionalidade', body: cover({n:8,time:5,el:false,mod:'Módulo 4 · Branches',cmds:['git switch -c <branch>','git branch','git switch main','git merge <branch>','git log --oneline --graph']},
      'Trabalhar numa branch separada, ver que a <code>main</code> não é afetada, e integrar com um merge <strong>fast-forward</strong>.',
      cmd('$ cd ~/labs/08-branch-de-funcionalidade') + '<p style="margin-top:10px;color:var(--muted)">Dois commits na <code>main</code>. Veja com <code>git log --oneline</code> e <code>git branch</code>.</p>')},
    {h:'Branch é um ponteiro', eyebrow:'Conceito', body:`
      <div class="cols s2"><div class="stack">
        ${graph({cap:'main é só um nome que aponta para um commit; HEAD diz em qual branch você está', commits:chain(['C1','C2']), edges:link(['C1','C2']),
          refs:[{name:'main',at:'C2'},{name:'HEAD',at:'C2',cls:'head'}]})}
        ${cmd(`$ cat .git/HEAD
> ref: refs/heads/main
$ cat .git/refs/heads/main
> 2f6c1e9a…   # 41 bytes: um hash e uma quebra de linha`)}
      </div><div class="stack">
        <div class="box lift"><h3>Branch, HEAD e commit</h3><ul class="plain"><li>Uma <strong>branch</strong> é um ponteiro para um commit; criar uma exige pouco espaço.</li><li><strong>HEAD</strong> aponta para a branch em que você está.</li><li>Fazer <strong>commit</strong> move a branch atual para o commit novo. As outras ficam onde estão.</li></ul></div>
        <div class="callout"><strong>Por isso "o arquivo sumiu"</strong> — ao trocar de branch, o Git reescreve o diretório de trabalho para a foto daquele commit. Nada foi apagado; está nos commits da outra branch.</div>
      </div></div>`},
    {h:'Fast-forward', eyebrow:'Conceito · quando a main não recebeu novos commits', body:`
      <div class="cols w2">
        ${graph({cap:'commits na branch: main fica para trás', commits:[...chain(['C1','C2']), {id:'C3',x:2,y:0,cls:'hi'}, {id:'C4',x:3,y:0,cls:'hi'}], edges:link(['C1','C2','C3','C4']),
          refs:[{name:'main',at:'C2'},{name:'feature/sobremesas',at:'C4'},{name:'HEAD',at:'C4',cls:'head'}]})}
        ${graph({cap:'git switch main + git merge feature/sobremesas → o ponteiro só avança', commits:[...chain(['C1','C2']), {id:'C3',x:2,y:0,cls:'hi'}, {id:'C4',x:3,y:0,cls:'hi'}], edges:link(['C1','C2','C3','C4']),
          refs:[{name:'feature/sobremesas',at:'C4'},{name:'main',at:'C4'},{name:'HEAD',at:'C4',cls:'head'}]})}
      </div>
      <div class="cols" style="margin-top:20px">
        <div class="box lift"><h3>Fast-forward</h3><p>A <code>main</code> não recebeu nenhum commit enquanto isso, então a história da branch é uma continuação direta. O Git <strong>só move o ponteiro</strong>: nenhum commit de merge é criado.</p></div>
        <div class="box"><h3>Depois do merge</h3><p><code>main</code> e <code>feature/sobremesas</code> apontam para o <strong>mesmo</strong> commit. Uma branch já integrada pode ser apagada; você fará isso no desafio 9.</p></div>
      </div>`},
    {h:'O desafio', eyebrow:'Tarefa · 5 min', body:`
      <div class="cols s2"><div class="stack">${steps([
        `<div class="t">Crie a branch e mude para ela de uma vez:</div>${cmd('$ git switch -c feature/sobremesas\n$ git branch')}`,
        `<div class="t">Crie <code>sobremesas.md</code> com um título e um item, e faça o commit. Depois acrescente outro item e faça um segundo commit:</div>${cmd(`$ git add sobremesas.md
$ git commit -m "Cria lista de sobremesas"
# edite o arquivo...
$ git commit -am "Adiciona mousse à lista"`)}`,
        `<div class="t">Volte para a <code>main</code> e olhe a pasta. O arquivo "sumiu":</div>${cmd('$ git switch main\n$ ls')}`,
        `<div class="t">Faça o merge. Como a <code>main</code> não recebeu novos commits, o Git apenas avança o ponteiro (fast-forward):</div>${cmd('$ git merge feature/sobremesas\n$ git log --oneline --graph\n$ ls')}`,
      ])}</div><div class="stack">
        <div class="box"><h3>Verificação</h3>${cmd('$ check.sh 08')}<p style="margin-top:10px;color:var(--muted)">Aprova se a <code>main</code> tem os commits e <strong>não</strong> há commit de merge.</p></div>
        <div class="box soft"><h3>Missão extra</h3>${cmd('$ git log --oneline --all --decorate')}<p style="margin-top:8px;color:var(--muted)"><code>main</code> e <code>feature/sobremesas</code> apontam para o mesmo commit.</p></div>
      </div></div>`},
    {h:'Comandos & documentação', eyebrow:'Referência', body:`
      <div class="cols s2">
        ${kv([
          ['git branch','lista as branches; * marca a atual'],
          ['git switch -c <nome>','cria a branch e muda para ela'],
          ['git switch <nome>','muda para uma branch existente (antes: git checkout)'],
          ['git merge <branch>','integra a branch indicada na atual'],
          ['git log --oneline --graph --all --decorate','o desenho com todos os ponteiros'],
        ])}
        <div class="box soft"><h3>Documentação</h3>${docs([L.pg_branch, L.pg_merge, L.pg_refs, L.r_switch, L.r_branch, L.r_merge, L.lgb])}</div>
      </div>`},
  ]});

D.push({n:9, key:'09', title:'Caminhos que divergem', mod:'Módulo 4 · Branches', time:6, el:false, cmds:['merge de três vias','git branch -d'],
  slides:[
    {h:'Caminhos que divergem', body: cover({n:9,time:6,el:false,mod:'Módulo 4 · Branches',cmds:['git log --oneline --graph --all','git merge <branch>','git branch -d <branch>']},
      'Fazer um merge de <strong>três vias</strong>: quando as duas branches receberam commits depois de se separarem, o Git precisa criar um <em>merge commit</em> para juntá-las.',
      cmd('$ cd ~/labs/09-caminhos-que-divergem') + '<p style="margin-top:10px;color:var(--muted)">Você está na <code>main</code>. <code>feature/bebidas</code> tem dois commits que a <code>main</code> não tem; a <code>main</code> tem um que a branch não tem.</p>')},
    {h:'Merge de três vias', eyebrow:'Conceito', body:`
      <div class="cols s2"><div class="stack">
        ${graph({cap:'base comum C2 · duas pontas C3 e C5 · o merge commit M tem dois pais',
          commits:[{id:'C1',x:0,y:0},{id:'C2',x:1,y:0},{id:'C3',x:2,y:0},{id:'C4',x:2,y:1},{id:'C5',x:3,y:1},{id:'M',x:4,y:0,cls:'merge'}],
          edges:[['C2','C1'],['C3','C2'],['C4','C2'],['C5','C4'],['M','C3','hi'],['M','C5','hi']],
          refs:[{name:'main',at:'M'},{name:'HEAD',at:'M',cls:'head'},{name:'feature/bebidas',at:'C5',below:true}], caps:[{at:'C2',text:'base'}]})}
      </div><div class="stack">
        <div class="box lift"><h3>As três vias</h3><ol class="plain" style="list-style:decimal"><li>a <strong>base</strong>: o último commit comum (C2);</li><li>a ponta da <strong>sua</strong> branch (C3);</li><li>a ponta da branch <strong>que chega</strong> (C5).</li></ol><p style="margin-top:8px">O Git compara o que cada branch alterou desde a base comum. Mudanças em trechos diferentes podem ser integradas automaticamente; alterações incompatíveis no mesmo trecho geram um conflito (desafio 11).</p></div>
        <div class="callout"><strong>O merge commit</strong> é um commit normal com <strong>dois pais</strong>. A mensagem vem pronta ("Merge branch 'feature/bebidas'"); o editor abre — salve e feche.</div>
      </div></div>`},
    {h:'Depois do merge', eyebrow:'Conceito · limpeza e --no-ff', body:`
      <div class="cols w2">
        ${graph({cap:'fast-forward (desafio 8): linha reta, sem marca de onde a feature existiu', commits:chain(['C1','C2','C3','C4']), edges:link(['C1','C2','C3','C4']), refs:[{name:'main',at:'C4'}]})}
        ${graph({cap:'git merge --no-ff: força um merge commit e preserva a forma', commits:[{id:'C1',x:0,y:0},{id:'C2',x:1,y:0},{id:'C3',x:2,y:1},{id:'C4',x:3,y:1},{id:'M',x:4,y:0,cls:'merge'}],
          edges:[['C2','C1'],['C3','C2'],['C4','C3'],['M','C2'],['M','C4','hi']], refs:[{name:'main',at:'M'}]})}
      </div>
      <div class="cols" style="margin-top:20px">
        <div class="box lift"><h3>git branch -d</h3><p>Após o merge, apagar a branch remove o <strong>ponteiro</strong>; os commits continuam alcançáveis pela <code>main</code>. O <code>-d</code> só aceita branches já integradas. Se o Git recusar, confira quais commits faltam integrar; <code>-D</code> força a exclusão mesmo nesse caso.</p></div>
        <div class="box"><h3>Por que alguns times usam --no-ff</h3><p>O gráfico mostra onde cada funcionalidade começou e terminou, e um <code>revert</code> do merge commit desfaz a funcionalidade inteira de uma vez.</p></div>
      </div>`},
    {h:'O desafio', eyebrow:'Tarefa · 6 min', body:`
      <div class="cols s2"><div class="stack">${steps([
        `<div class="t">Veja a bifurcação:</div>${cmd('$ git log --oneline --graph --all')}`,
        `<div class="t">Faça o merge. O Git abre o editor com a mensagem sugerida para o commit de merge. <strong>Salve e feche</strong> para concluir:</div>${cmd('$ git merge feature/bebidas')}`,
        `<div class="t">O merge commit tem dois pais:</div>${cmd('$ git log --oneline --graph --all')}`,
        `<div class="t">Apague a branch agora que seus commits foram integrados à <code>main</code>:</div>${cmd('$ git branch -d feature/bebidas\n$ git branch')}`,
      ])}</div><div class="stack">

D.push({n:15, key:'15', title:'Seu primeiro pull request', mod:'Módulo 7 · Fluxo no GitHub', time:7, el:true, cmds:['branch','pull request','merge na web','git pull'],

      'Percorrer o fluxo que a maioria das equipes usa: <strong>branch → push → pull request → merge na web → pull local</strong>.',
      cmd('$ cd ~/labs/14-publique-no-github') + '<p style="margin-top:10px;color:var(--muted)">A mesma pasta do desafio 14, já ligada ao seu repositório no GitHub.</p>')},
    {h:'O fluxo', eyebrow:'Conceito · pull request', body:`

            edges:[['C2','C1'],['C3','C2'],['M','C2'],['M','C3','hi']], refs:[{name:'main (local)',at:'C2'},{name:'origin/main',at:'M',cls:'remote'},{name:'mais-um-aprendizado',at:'C3',below:true}]})}
          <div class="stack">
            <div class="box lift"><h3>Por que não commitar direto na main?</h3><p>No pull request, você pode <strong>revisar e discutir</strong> a mudança antes de integrá-la, com comentários linha a linha e resultados de testes automáticos. Essa revisão também pode ser feita quando você trabalha sozinho.</p></div>

        `<div class="t">O merge aconteceu no GitHub. Sincronize a <code>main</code> local:</div>${cmd('$ git switch main\n$ git pull\n$ git log --oneline --graph -5')}`,
        `<div class="t">Apague a cópia local da branch (o GitHub oferece um botão para a remota):</div>${cmd('$ git branch -d mais-um-aprendizado')}`,
      ])}</div><div class="stack">
        <div class="box"><h3>Verificação</h3>${cmd('$ check.sh 15')}<p style="margin-top:10px;color:var(--muted)">Aprova com a <code>main</code> sincronizada e a branch apagada.</p></div>
        <div class="box soft"><h3>Missão extra · revisão de código</h3><p>Abra um segundo PR e, antes do merge, deixe um comentário numa linha do diff, na aba <strong>Files changed</strong>.</p></div>
        <div class="callout warn"><strong>⏱ Pode ficar para depois da aula.</strong> Se houver atraso, deixe este desafio como tarefa de casa. Ao concluir, rode <code>check.sh 14</code> e <code>check.sh 15</code>, depois pare ou exclua o Codespace.</div>

</script>
<script>
/* ---------- app: home + router ---------- */
const ALL = [INTRO, ...D];
const byKey = k => ALL.find(d => String(d.key) === String(k));
const pad = n => typeof n === 'number' ? String(n).padStart(2,'0') : n;

function renderHome(){
  const total = D.reduce((a,d)=>a+d.time,0);
  const tiles = ALL.map(d => {
    const isIntro = d.key === 'intro';
    return `<a class="tile ${d.el?'el':''}" href="#/d/${d.key}/1" ${d.el?'title="Pode ficar como tarefa para depois da aula se houver atraso"':''}>
      <div class="row"><div class="num">${isIntro?'∅':pad(d.n)}</div><div class="mod">${d.mod}</div></div>
      <div><h3>${isIntro? d.short : d.title}</h3><div class="cmds" style="margin-top:8px">${d.cmds.map(esc).join(' · ')}</div></div>
      <div class="foot"><span>${d.slides.length} slides</span><span>⏱ ${d.time} min</span></div>
    </a>`;
  }).join('');
  document.getElementById('home').innerHTML = `
    <header class="hero">
      <div><h1>Git<span>no Codespaces</span></h1>
        <p class="sub">Curso de Git para iniciantes, com 3 horas de aula ao vivo pelo Zoom e prática no Codespace individual de cada pessoa. Você faz os exercícios pelo navegador, sem instalar nada no computador. Escolha um desafio para abrir os slides.</p></div>
      <div class="meta"><div><b>16</b>desafios</div><div><b>${total}</b>min de prática</div><div><b>3h</b>de aula</div></div>
    </header>
    <div class="legend"><span><span class="sw"></span>desafio</span><span><span class="sw el"></span>⏱ pode ficar para depois da aula se houver atraso</span><span>teclado: <kbd>→</kbd> <kbd>←</kbd> navegar · <kbd>Esc</kbd> voltar aqui · <kbd>F</kbd> tela cheia</span></div>
    <div class="grid">${tiles}</div>
    <footer class="homefoot">
      <span>Ordem da aula: 0 → 15, com intervalo depois do 7.</span>
      <span>Enunciados, gabarito e guia do professor: <a href="https://github.com/fsilva-alt/devops-git" target="_blank" rel="noopener">github.com/fsilva-alt/devops-git</a></span>
      <span>Leitura sugerida: <a href="https://git-scm.com/book/pt-br/v2" target="_blank" rel="noopener">Pro Git (pt-br)</a></span>
    </footer>`;
}

let cur = null; // {d, i}
function renderSlide(d, i){
  const s = d.slides[i];
  const n = d.slides.length;
  const isIntro = d.key === 'intro';
  document.getElementById('crumb').innerHTML = `${isIntro?'<b>Introdução</b>':`Desafio <b>${pad(d.n)}</b> · <b>${esc(d.title)}</b>`}<span style="opacity:.6"> · ${esc(s.h)}</span>`;
  document.getElementById('counter').textContent = `${i+1} / ${n}`;
  document.getElementById('dots').innerHTML = d.slides.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('');
  const el = document.getElementById('slide');
  el.innerHTML = `<div class="eyebrow">${esc(s.eyebrow || (isIntro? 'Introdução' : `Desafio ${pad(d.n)} · ${d.mod}`))}</div><h2>${s.h}</h2>${s.body}`;
  el.style.animation = 'none'; void el.offsetWidth; el.style.animation = '';
  const prev = document.getElementById('btnPrev'), next = document.getElementById('btnNext');
  prev.toggleAttribute('disabled', i === 0);
  const idx = ALL.indexOf(d), last = i === n-1;
  if (last && idx < ALL.length-1){ const nd = ALL[idx+1]; next.innerHTML = `${nd.key==='intro'?'Introdução':'Desafio '+pad(nd.n)} →`; next.dataset.goto = `#/d/${nd.key}/1`; }
  else if (last){ next.innerHTML = 'Desafios ↑'; next.dataset.goto = '#/'; }
  else { next.innerHTML = 'Próximo →'; delete next.dataset.goto; }
  window.scrollTo({top:0});
}

function route(){
  const h = location.hash || '#/';
  const m = h.match(/^#\/d\/([^/]+)(?:\/(\d+))?/);
  const home = document.getElementById('home'), deck = document.getElementById('deck');
  if (m && byKey(m[1])){
    const d = byKey(m[1]);
    let i = Math.min(Math.max((parseInt(m[2]||'1',10)||1)-1, 0), d.slides.length-1);
    cur = {d, i};
    home.classList.add('hidden'); deck.classList.remove('hidden');
    renderSlide(d, i);
    document.title = `${d.key==='intro'?'Introdução':'Desafio '+pad(d.n)} · ${d.title} — Git no Codespaces`;
  } else {
    cur = null;
    deck.classList.add('hidden'); home.classList.remove('hidden');
    document.title = 'Git no Codespaces';
    if (h !== '#/') history.replaceState(null,'','#/');
  }
}
function go(delta){
  if (!cur) return;
  const {d, i} = cur;
  const ni = i + delta;
  if (ni < 0){ return; }
  if (ni >= d.slides.length){
    const next = document.getElementById('btnNext');
    if (next.dataset.goto) location.hash = next.dataset.goto;
    return;
  }
  location.hash = `#/d/${d.key}/${ni+1}`;
}

document.getElementById('btnPrev').addEventListener('click', ()=>go(-1));
document.getElementById('btnNext').addEventListener('click', ()=>go(1));
document.addEventListener('keydown', e => {
  if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  switch (e.key){
    case 'ArrowRight': case 'ArrowDown': case 'PageDown': case ' ': if (cur){ e.preventDefault(); go(1);} break;
    case 'ArrowLeft': case 'ArrowUp': case 'PageUp': case 'Backspace': if (cur){ e.preventDefault(); go(-1);} break;
    case 'Escape': case 'h': case 'H': location.hash = '#/'; break;
    case 'f': case 'F': (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.()); break;
    case 'Home': if (cur){ location.hash = `#/d/${cur.d.key}/1`; } break;
    case 'End': if (cur){ location.hash = `#/d/${cur.d.key}/${cur.d.slides.length}`; } break;
  }
});
// swipe
let tx = null;
document.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, {passive:true});
document.addEventListener('touchend', e => {
  if (tx === null || !cur) return;
  const dx = e.changedTouches[0].clientX - tx; tx = null;
  if (Math.abs(dx) > 60) go(dx < 0 ? 1 : -1);
}, {passive:true});

window.addEventListener('hashchange', route);
renderHome();
route();
</script>
